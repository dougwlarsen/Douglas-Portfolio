<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Furniture — Douglas Larsen</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fff2eb;--blue:#3a30e8;--blue-deep:#2019b0;--ink:#101018;--ink-soft:#6a6a78;--line:rgba(16,16,24,.14);
    --serif:'Cormorant',Georgia,serif;--sans:'Inter',system-ui,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  .wrap{max-width:1240px;margin:0 auto;padding:0 40px}
  .ey{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--blue);font-weight:600}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
    padding:18px 40px;background:rgba(255,242,235,.95);border-bottom:1px solid var(--line)}
  nav .brand{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700}
  nav .brand b{color:var(--blue)}
  nav .back{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line);border-radius:40px;padding:8px 16px}
  nav .back:hover{border-color:var(--blue);color:var(--blue)}

  header{min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;padding:150px 0 90px}
  header .eyebrow{margin-bottom:26px}
  h1{font-family:var(--serif);text-transform:uppercase;font-weight:500;font-size:clamp(56px,12vw,168px);line-height:.94;letter-spacing:.005em}
  h1 em{font-style:italic;color:var(--blue)}
  header .sub{max-width:560px;margin-top:32px;font-size:19px;color:var(--ink-soft)}
  header .sub em{font-family:var(--serif);font-style:italic;color:var(--blue);font-size:22px}
  .cue{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}
  .cue::after{content:"";display:block;width:1px;height:38px;margin:12px auto 0;background:linear-gradient(var(--blue),transparent);animation:cue 2s infinite}
  @keyframes cue{0%{opacity:.2;transform:scaleY(.4)}50%{opacity:1}100%{opacity:.2;transform:scaleY(.4)}}

  /* progress rail */
  .rail{position:fixed;left:auto;right:26px;top:50%;transform:translateY(-50%);width:auto;padding:0;background:none;border:0;z-index:90;display:flex;flex-direction:column;gap:16px}
  .rail a{display:flex;align-items:center;gap:9px;justify-content:flex-end;color:var(--ink-soft);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;transition:.3s}
  .rail a .dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--blue);transition:.3s}
  .rail a.on{opacity:1;color:var(--blue)} .rail a.on .dot{background:var(--blue)}
  .rail a .lbl{opacity:0;transform:translateX(6px);transition:.3s}
  .rail a:hover .lbl,.rail a.on .lbl{opacity:1;transform:none}
  @media(max-width:1100px){.rail{display:none}}

  .stage{padding:96px 0;border-top:1px solid var(--line)}
  .stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
  .stage.alt .media{order:2}
  .stage .num{font-family:var(--serif);font-size:clamp(60px,9vw,120px);line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--blue);font-weight:600}
  .stage .step{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--blue);font-weight:600;margin:18px 0 10px}
  .stage h2{font-family:var(--serif);text-transform:uppercase;font-size:clamp(30px,4.2vw,58px);font-weight:500;line-height:1;letter-spacing:.01em}
  .stage p{margin-top:20px;font-size:17px;color:var(--ink-soft);max-width:46ch}
  .stage .tags{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px}
  .stage .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);border:1px solid rgba(58,48,232,.35);border-radius:40px;padding:6px 13px}

  .media{position:relative}
  .media img{width:100%;height:auto;border-radius:4px;box-shadow:0 24px 60px rgba(58,48,232,.14)}
  /* placeholder until real photos arrive */
  .ph{aspect-ratio:4/3;border:2px dashed rgba(58,48,232,.4);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:repeating-linear-gradient(135deg,rgba(58,48,232,.03),rgba(58,48,232,.03) 12px,transparent 12px,transparent 24px)}
  .ph .k{font-family:var(--serif);font-size:26px;color:var(--blue);font-weight:500}
  .ph .n{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:8px}

  footer{padding:120px 0 90px;text-align:center;border-top:1px solid var(--line)}
  footer .big{font-family:var(--serif);text-transform:uppercase;font-size:clamp(40px,8vw,96px);font-weight:500;line-height:1}
  footer .big a{color:var(--blue)}
  footer .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:22px}

  .reveal{opacity:0;transform:translateY(28px);transition:opacity 1s,transform 1s}
  .reveal.in{opacity:1;transform:none}

  @media(max-width:860px){
    .wrap{padding:0 24px}nav{padding:16px 24px}
    .stage-grid{grid-template-columns:1fr;gap:30px}
    .stage.alt .media{order:0}
  }
</style>
</head>
<body>
<nav>
  <div class="brand">Douglas <b>Larsen</b> · Custom Furniture</div>
  <a class="back" href="index.html">← back to interiors</a>
</nav>

<nav class="rail" aria-hidden="true"></nav>

<header class="wrap">
  <div class="ey eyebrow">The Process</div>
  <h1>Custom<br><em>Furniture</em></h1>
  <p class="sub">How a bespoke piece goes from a room and a problem to a finished object — <em>drawn, tested, and made by hand.</em></p>
  <div class="cue">Scroll</div>
</header>

<main id="stages"></main>

<footer class="wrap">
  <div class="big"><a href="index.html">back to interiors →</a></div>
  <div class="sub">Douglas Larsen · Principal Interior Designer · NYC</div>
</footer>

<script>
  const stages=[
    {n:"01",key:"Brief",title:"The Brief",need:"Room / mood reference",
     copy:"Every custom piece starts with the room and the person. I map how the space is used, the sightlines, the light, and the exact problem the piece needs to solve.",
     tags:["Site visit","Function","Constraints"]},
    {n:"02",key:"Concept",title:"Concept & Sketch",need:"Hand sketch",
     copy:"Quick hand sketches to find the form — proportion, stance, and the single idea that makes the piece feel inevitable in the space.",
     tags:["Sketch","Proportion","Form study"]},
    {n:"03",key:"Drawings",title:"Drawings & CAD",need:"CAD / shop drawing",
     copy:"Concepts become precise drawings — dimensions, joinery, hardware, and shop-ready detail in AutoCAD, SketchUp, and Fusion 360.",
     tags:["AutoCAD","SketchUp","Fusion 360","Joinery"]},
    {n:"04",key:"Materials",title:"Materials & Finish",need:"Material / finish samples",
     copy:"Selecting the woods, stone, metal, and finishes — because color and material carry the whole mood of a piece as much as its shape.",
     tags:["Wood","Stone","Metal","Finish"]},
    {n:"05",key:"Prototype",title:"Prototype",need:"Mockup / prototype photo",
     copy:"Full-scale mockups to test comfort, scale, and detail in the real world — then refine until it's right.",
     tags:["Mockup","Ergonomics","Refine"]},
    {n:"06",key:"Install",title:"Fabrication & Install",need:"Finished piece in place",
     copy:"Built alongside skilled makers, then placed and dialed in on site — the piece finally at home in the room it was drawn for.",
     tags:["Fabrication","Makers","On-site"]},
  ];
  const main=document.getElementById('stages'), rail=document.querySelector('.rail');
  stages.forEach((s,i)=>{
    const sec=document.createElement('section');
    sec.className='stage reveal'+(i%2?' alt':''); sec.id='s'+s.n;
    sec.innerHTML=`<div class="wrap stage-grid">
      <div class="media"><div class="ph"><div class="k">${s.title}</div><div class="n">Add: ${s.need}</div></div></div>
      <div class="copy"><div class="num">${s.n}</div><div class="step">Step ${s.n}</div>
        <h2>${s.title}</h2><p>${s.copy}</p>
        <div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>
    </div>`;
    main.appendChild(sec);
    rail.innerHTML+=`<a href="#s${s.n}" data-id="s${s.n}"><span class="lbl">${s.key}</span><span class="dot"></span></a>`;
  });

  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.14});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  // progress rail active state
  const links=[...rail.querySelectorAll('a')];
  const io2=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ links.forEach(a=>a.classList.toggle('on',a.dataset.id===e.target.id)); }
  }),{rootMargin:'-45% 0px -45% 0px'});
  document.querySelectorAll('.stage').forEach(el=>io2.observe(el));
</script>
</body>
</html>
