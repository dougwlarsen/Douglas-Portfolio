<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blueprint Runner — Douglas Larsen</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fff2eb;--blue:#3a30e8;--blue-deep:#2019b0;--ink:#101018;--ink-soft:#6a6a78;
    --serif:'Cormorant',Georgia,serif;--sans:'Inter',system-ui,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;touch-action:none}
  a{color:inherit;text-decoration:none}
  .top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;z-index:5}
  .brand{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700}
  .brand b{color:var(--blue)}
  .back{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);border:1px solid rgba(16,16,24,.18);border-radius:40px;padding:8px 16px}
  .back:hover{border-color:var(--blue);color:var(--blue)}
  .stage{position:relative;width:min(92vw,940px);box-shadow:0 20px 60px rgba(58,48,232,.14);border:1px solid rgba(58,48,232,.18);border-radius:6px;overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  .over{position:absolute;inset:0;background:rgba(255,242,235,.93);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .over.show{display:flex}
  .over h1{font-family:var(--serif);font-size:clamp(38px,6vw,58px);font-weight:600;line-height:1;text-transform:uppercase}
  .over .big{font-family:var(--serif);font-size:clamp(56px,10vw,84px);color:var(--blue);line-height:1;margin:6px 0}
  .over p{color:var(--ink-soft);font-size:14px;letter-spacing:.02em}
  .btn{margin-top:20px;display:inline-block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;
    padding:14px 32px;border:1px solid var(--blue);color:#fff;background:var(--blue);border-radius:40px;cursor:pointer;pointer-events:auto}
  .btn:hover{background:var(--blue-deep)}
  .btn.ghost{background:none;color:var(--blue);margin-left:8px}
  .btn.ghost:hover{background:var(--blue);color:#fff}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Douglas <b>Larsen</b> · Blueprint Runner</div>
    <a class="back" href="index.html">← Back to site</a>
  </div>
  <div class="stage">
    <canvas id="c" width="900" height="420"></canvas>
    <div class="over" id="over">
      <h1>Crash!</h1>
      <div class="big" id="final">0</div>
      <p id="msg">You ran into the furniture.</p>
      <div>
        <button class="btn" id="again">Run Again</button>
        <a class="btn ghost" href="index.html">Exit</a>
      </div>
    </div>
  </div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=420, GROUND=H-64;
const BLUE='#3a30e8', DEEP='#2019b0', CREAM='#fff2eb';
const SWATCH=['#6f66ff','#660000','#c5cf17','#006442','#cfd6ff','#eb593d'];
let dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);

let runner, obs, swatches, speed, dist, picks, frame, over, best, spawnT, swT, shake;
best=Number(localStorage.getItem('br_best')||0);

function reset(){
  runner={x:130,y:GROUND,vy:0,w:26,h:42,onGround:true,jumps:0,run:0};
  obs=[]; swatches=[]; speed=4.2; dist=0; picks=0; frame=0; over=false;
  spawnT=40; swT=90; shake=0;
  document.getElementById('over').classList.remove('show');
}
function jump(){
  if(over) return;
  if(runner.jumps<2){ runner.vy=-16.5; runner.onGround=false; runner.jumps++; blip(520,0.05); }
}
const OBS_DIM={lamp:[22,64],chair:[42,46],diningchair:[34,52],armchair:[54,44],
  sofa:[94,40],loveseat:[68,40],bench:[72,26],table:[60,28],plant:[34,46],stool:[26,28]};
// bag weighted toward chairs & sofas
const OBS_BAG=['chair','chair','diningchair','armchair','armchair','sofa','sofa','loveseat','loveseat','bench','table','lamp','plant','stool'];
function spawnObstacle(){
  const kind=OBS_BAG[(Math.random()*OBS_BAG.length)|0];
  const [w,h]=OBS_DIM[kind];
  obs.push({x:W+20,w,h,kind});
  // next spawn: gap scales with speed so it's always clearable
  spawnT=Math.max(50, (156 - speed*4) + Math.random()*70);
}
function spawnSwatch(){
  const y=GROUND-70-Math.random()*80;
  swatches.push({x:W+20,y,r:10,c:SWATCH[(Math.random()*SWATCH.length)|0],got:false});
  swT=70+Math.random()*90;
}
function hit(a,ox,oy,ow,oh){ // AABB vs runner (a)
  return a.x-a.w/2< ox+ow && a.x+a.w/2>ox && a.y-a.h< oy+oh && a.y>oy;
}
function gameOver(){
  over=true; shake=14;
  if(Math.floor(score())>best){best=Math.floor(score());localStorage.setItem('br_best',best);}
  document.getElementById('final').textContent=Math.floor(score());
  document.getElementById('msg').textContent=`Distance ${Math.floor(dist/10)} · ${picks} swatches · Best ${best}`;
  document.getElementById('over').classList.add('show');
  crash();
}
function score(){ return dist/10 + picks*5; }

function update(){
  if(over) return;
  frame++; dist+=speed; speed+=0.0025;
  // runner physics
  runner.vy+=0.86; runner.y+=runner.vy;
  if(runner.y>=GROUND){ runner.y=GROUND; runner.vy=0; runner.onGround=true; runner.jumps=0; }
  runner.run=(runner.run+ (runner.onGround?0.35:0.12))%(Math.PI*2);
  // obstacles
  if(--spawnT<=0) spawnObstacle();
  for(const o of obs){ o.x-=speed; if(hit(runner,o.x,GROUND-o.h,o.w,o.h)) return gameOver(); }
  obs=obs.filter(o=>o.x+o.w>-10);
  // swatches
  if(--swT<=0) spawnSwatch();
  for(const s of swatches){ s.x-=speed;
    if(!s.got && Math.abs(s.x-runner.x)<s.r+runner.w/2 && Math.abs(s.y-(runner.y-runner.h/2))<s.r+runner.h/2){
      s.got=true; picks++; blip(880,0.06); setTimeout(()=>blip(1180,0.05),40);
    }
  }
  swatches=swatches.filter(s=>s.x>-20 && !s.got);
  if(shake>0) shake*=0.9;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.3) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // blueprint grid
  ctx.strokeStyle='rgba(58,48,232,.10)'; ctx.lineWidth=1;
  const off=(dist*0.5)%40;
  for(let x=-off;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // ground
  ctx.strokeStyle=BLUE; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
  // ground hatch
  ctx.strokeStyle='rgba(58,48,232,.3)'; ctx.lineWidth=1;
  for(let x=-((dist*1)%22);x<W;x+=22){ctx.beginPath();ctx.moveTo(x,GROUND);ctx.lineTo(x-12,GROUND+18);ctx.stroke();}
  // swatches
  for(const s of swatches){ if(s.got)continue;
    ctx.fillStyle=s.c; ctx.strokeStyle=DEEP; ctx.lineWidth=2;
    ctx.beginPath(); ctx.rect(s.x-s.r,s.y-s.r,s.r*2,s.r*2); ctx.fill(); ctx.stroke();
  }
  // obstacles (blueprint furniture)
  ctx.lineWidth=2; ctx.strokeStyle=BLUE; ctx.fillStyle='rgba(58,48,232,.06)';
  for(const o of obs) drawFurniture(o);
  // runner
  drawRunner(runner);
  ctx.restore();
  // HUD
  ctx.fillStyle=BLUE; ctx.font='600 30px Cormorant, serif';
  ctx.textAlign='left'; ctx.fillText(Math.floor(score()), 20, 40);
  ctx.fillStyle='rgba(16,16,24,.5)'; ctx.font='500 10px Inter, sans-serif';
  ctx.fillText('SCORE', 21, 54);
  ctx.textAlign='right'; ctx.fillStyle='rgba(16,16,24,.5)';
  ctx.fillText('BEST '+best, W-20, 30);
  ctx.fillText(picks+' SWATCHES', W-20, 46);
  ctx.textAlign='center'; ctx.fillStyle='rgba(16,16,24,.4)';
  if(frame<160){ ctx.font='500 11px Inter, sans-serif'; ctx.fillText('TAP / SPACE TO JUMP  ·  DOUBLE-JUMP OK', W/2, H-20); }
}
function rrp(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawFurniture(o){
  const c=ctx, x=o.x, w=o.w, h=o.h, b=GROUND, t=b-h;
  c.lineWidth=2; c.strokeStyle=BLUE; c.fillStyle='rgba(58,48,232,.05)';
  const rr=(a,y2,ww,hh,r)=>{rrp(c,a,y2,ww,hh,r||2);c.fill();c.stroke();};
  const ln=(x1,y1,x2,y2)=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();};
  if(o.kind==='chair'){
    const s=b-h*0.5;
    rr(x,s,w,h*0.16,3);            // seat
    rr(x,t,w*0.24,h*0.55,3);       // backrest
    ln(x+5,s,x+5,b); ln(x+w-5,s+h*0.16,x+w-5,b);
  } else if(o.kind==='diningchair'){
    const s=b-h*0.42;
    rr(x,s,w,h*0.14,2);
    rr(x,t,w*0.2,h*0.6,2);
    for(let i=1;i<3;i++) ln(x+w*0.04,t+h*0.6*i/3,x+w*0.16,t+h*0.6*i/3);
    ln(x+5,s+h*0.14,x+5,b); ln(x+w-5,s+h*0.14,x+w-5,b);
  } else if(o.kind==='armchair'){
    const s=b-h*0.5;
    rr(x,t,w,h,8);                 // body
    rr(x+w*0.16,s,w*0.68,h*0.34,4);// seat cushion
    rr(x,s-h*0.06,w*0.16,h*0.5,4); // left arm
    rr(x+w*0.84,s-h*0.06,w*0.16,h*0.5,4);
    ln(x+7,b-4,x+7,b); ln(x+w-7,b-4,x+w-7,b);
  } else if(o.kind==='sofa'||o.kind==='loveseat'){
    const seats=o.kind==='sofa'?3:2, s=b-h*0.52, iw=w*0.8, sx=x+w*0.1;
    rr(x,t,w,h*0.72,8);            // back mass
    rr(x,s,w,h*0.34,6);           // seat base
    rr(x,s-h*0.08,w*0.1,h*0.5,4); // left arm
    rr(x+w*0.9,s-h*0.08,w*0.1,h*0.5,4);
    for(let i=0;i<seats;i++){
      rr(sx+iw*i/seats+2,s-h*0.02,iw/seats-4,h*0.2,3);   // seat cushions
      rr(sx+iw*i/seats+2,t+3,iw/seats-4,h*0.34,3);       // back cushions
    }
    ln(x+8,b-5,x+8,b); ln(x+w-8,b-5,x+w-8,b);
  } else if(o.kind==='bench'){
    const s=b-h*0.55;
    rr(x,s,w,h*0.22,2);
    for(let i=1;i<4;i++) ln(x+w*i/4,s,x+w*i/4,s+h*0.22);
    ln(x+6,s+h*0.22,x+6,b); ln(x+w-6,s+h*0.22,x+w-6,b);
  } else if(o.kind==='lamp'){
    ln(x+w/2,t+h*0.22,x+w/2,b);
    c.beginPath(); c.moveTo(x,t+h*0.22); c.lineTo(x+w,t+h*0.22); c.lineTo(x+w*0.5,t); c.closePath(); c.fill(); c.stroke();
    ln(x+w*0.3,b,x+w*0.7,b);
  } else if(o.kind==='plant'){
    rr(x+w*0.28,b-h*0.32,w*0.44,h*0.32,2);
    c.beginPath(); c.moveTo(x+w*0.5,b-h*0.32); c.lineTo(x+w*0.14,t);
    c.moveTo(x+w*0.5,b-h*0.32); c.lineTo(x+w*0.86,t+h*0.14);
    c.moveTo(x+w*0.5,b-h*0.32); c.lineTo(x+w*0.5,t-2); c.stroke();
  } else if(o.kind==='table'){
    rr(x,t,w,h*0.28,2);
    ln(x+6,t+h*0.28,x+6,b); ln(x+w-6,t+h*0.28,x+w-6,b);
  } else { // stool
    rr(x,b-h*0.42,w,h*0.2,3); ln(x+5,b-h*0.22,x+5,b); ln(x+w-5,b-h*0.22,x+w-5,b);
  }
}
function drawRunner(r){
  const cx=r.x, hipY=r.y-18, headY=r.y-r.h;
  ctx.strokeStyle=DEEP; ctx.fillStyle=CREAM; ctx.lineWidth=2.4;
  // head
  ctx.beginPath(); ctx.arc(cx,headY+8,8,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // body
  ctx.beginPath(); ctx.moveTo(cx,headY+16); ctx.lineTo(cx,hipY); ctx.stroke();
  // arms
  const sw=Math.sin(r.run)*7;
  ctx.beginPath(); ctx.moveTo(cx,headY+22); ctx.lineTo(cx+10,headY+22+sw); ctx.moveTo(cx,headY+22); ctx.lineTo(cx-10,headY+22-sw); ctx.stroke();
  // legs (run cycle)
  const l=Math.sin(r.run)*10, l2=Math.sin(r.run+Math.PI)*10;
  ctx.beginPath(); ctx.moveTo(cx,hipY); ctx.lineTo(cx+l,r.y); ctx.moveTo(cx,hipY); ctx.lineTo(cx+l2,r.y); ctx.stroke();
}

let actx; try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
function tone(f,d,t,g){ if(!actx)return; const o=actx.createOscillator(),ga=actx.createGain();
  o.type=t||'sine';o.frequency.value=f;ga.gain.value=g||0.05;o.connect(ga);ga.connect(actx.destination);
  o.start();ga.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);o.stop(actx.currentTime+d);}
function blip(f,d){tone(f,d,'square',0.045);}
function crash(){tone(140,0.3,'sawtooth',0.08);setTimeout(()=>tone(90,0.4,'sawtooth',0.07),110);}

function press(e){ if(e.type==='keydown'&&e.code!=='Space'&&e.code!=='ArrowUp')return; if(e.cancelable)e.preventDefault();
  if(actx&&actx.state==='suspended')actx.resume();
  if(over)return; jump(); }
window.addEventListener('pointerdown',press);
window.addEventListener('keydown',press);
document.getElementById('again').addEventListener('click',(e)=>{e.stopPropagation();reset();});

function loop(){ update(); draw(); requestAnimationFrame(loop); }
reset(); loop();
</script>
</body>
</html>
