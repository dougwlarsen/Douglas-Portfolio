<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color of the Day — Douglas Larsen</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fff2eb;--blue:#3a30e8;--blue-deep:#2019b0;--ink:#101018;--ink-soft:#6a6a78;--line:rgba(16,16,24,.14);
    --serif:'Cormorant',Georgia,serif;--sans:'Inter',system-ui,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:820px;margin:0 auto;padding:0 28px}
  nav{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line)}
  .brand{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700}
  .brand b{color:var(--blue)}
  .back{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line);border-radius:40px;padding:8px 16px}
  .back:hover{border-color:var(--blue);color:var(--blue)}
  header{text-align:center;padding:64px 0 20px}
  .ey{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--blue);font-weight:600}
  h1{font-family:var(--serif);text-transform:uppercase;font-weight:600;font-size:clamp(40px,8vw,84px);line-height:.98;margin-top:14px}
  .sub{color:var(--ink-soft);margin-top:12px;font-size:15px}
  .card{border:1px solid var(--line);border-radius:8px;padding:26px;margin:26px 0;background:rgba(255,255,255,.35)}
  label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
  input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:14px;background:#fff}
  input:focus{outline:none;border-color:var(--blue)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .btn{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:14px 30px;border:1px solid var(--blue);color:#fff;background:var(--blue);border-radius:40px;cursor:pointer}
  .btn:hover{background:var(--blue-deep)}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:none;color:var(--blue)}
  .btn.ghost:hover{background:var(--blue);color:#fff}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:12px}
  .hint a{color:var(--blue);text-decoration:underline}
  .status{margin-top:16px;font-size:13px;color:var(--ink-soft)}
  .err{color:#b3251b}

  .result{display:none}
  .result.show{display:block}
  .swatch{border-radius:12px;padding:40px 30px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.14);position:relative;overflow:hidden}
  .swatch .date{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.85}
  .swatch .hex{font-family:var(--serif);font-weight:600;font-size:clamp(44px,11vw,96px);line-height:1;margin:8px 0 4px;text-transform:uppercase}
  .swatch .meta{font-size:13px;opacity:.9}
  .palette{display:flex;height:44px;border-radius:8px;overflow:hidden;margin-top:18px;border:1px solid var(--line)}
  .palette span{flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:18px}
  .thumb{aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--line);position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb i{position:absolute;left:0;right:0;bottom:0;height:6px}
  .foot{margin-top:26px;font-size:11px;color:var(--ink-soft);text-align:center}
  .foot a{color:var(--blue)}
</style>
</head>
<body>
  <nav>
    <div class="brand">Douglas <b>Larsen</b> · Color of the Day</div>
    <a class="back" href="index.html">← Back to site</a>
  </nav>

  <div class="wrap">
    <header>
      <div class="ey">Powered by Unsplash</div>
      <h1>Color<br>of the Day</h1>
      <p class="sub">The most-used dominant color across the photos uploaded to Unsplash today.</p>
    </header>

    <div style="text-align:center">
      <div class="status" id="status">Reading today’s uploads…</div>
      <button class="btn ghost" id="go" style="margin-top:14px">Refresh</button>
    </div>

    <div class="result" id="result">
      <div class="swatch" id="swatch">
        <div class="date" id="rdate"></div>
        <div class="hex" id="rhex">#000000</div>
        <div class="meta" id="rmeta"></div>
      </div>
      <div class="palette" id="palette"></div>
      <div class="grid" id="grid"></div>
    </div>

    <p class="foot" id="foot"></p>
  </div>

<script>
const API='https://api.unsplash.com';
const $=id=>document.getElementById(id);
const KEY='SWAojVJs9NvDXZZhKmV2oH_pZW74Yag84NN7Z5h3Et0'; // Unsplash Access Key — public client-side ID by design

$('go').onclick=()=>run(true);
async function run(force){
  $('go').disabled=true;
  const today=new Date().toISOString().slice(0,10);
  const cache=JSON.parse(localStorage.getItem('cotd_'+today)||'null');
  if(cache && !force){ render(cache); setStatus('Today’s color · cached'); $('go').disabled=false; return; }

  const colors=[], samples=[]; let page=1, scanned=0, stop=false;
  try{
    while(page<=6 && !stop){
      setStatus(`Scanning Unsplash… page ${page} (${scanned} photos)`);
      const r=await fetch(`${API}/photos?order_by=latest&per_page=30&page=${page}`,{headers:{'Authorization':'Client-ID '+KEY,'Accept-Version':'v1'}});
      if(r.status===401){ setStatus('That key was rejected (401). Double-check your Access Key.',true); $('go').disabled=false; return; }
      if(r.status===403){ setStatus('Rate limit reached (403). Demo keys allow 50 requests/hour — try again later.',true); $('go').disabled=false; return; }
      if(!r.ok){ setStatus('Unsplash error '+r.status+'.',true); $('go').disabled=false; return; }
      const data=await r.json();
      if(!data.length) break;
      for(const p of data){
        scanned++;
        const d=(p.created_at||'').slice(0,10);
        if(d===today && p.color){
          colors.push(p.color);
          if(samples.length<24) samples.push({c:p.color,thumb:p.urls&&p.urls.thumb,link:(p.links&&p.links.html)||'#',who:(p.user&&p.user.name)||''});
        } else if(d && d<today){ stop=true; } // latest is newest-first; past today = done
      }
      page++;
    }
  }catch(e){ setStatus('Network error: '+e.message,true); $('go').disabled=false; return; }

  let usedFallback=false;
  if(colors.length<5){
    // early in the UTC day — fall back to the most recent photos
    usedFallback=true;
    setStatus('Few photos so far today — using the most recent uploads instead…');
    const r=await fetch(`${API}/photos?order_by=latest&per_page=30&page=1`,{headers:{'Authorization':'Client-ID '+KEY,'Accept-Version':'v1'}});
    const data=await r.json();
    colors.length=0; samples.length=0;
    for(const p of data){ if(p.color){ colors.push(p.color); if(samples.length<24) samples.push({c:p.color,thumb:p.urls&&p.urls.thumb,link:(p.links&&p.links.html)||'#',who:(p.user&&p.user.name)||''}); } }
  }

  if(!colors.length){ setStatus('No colors found. Try again in a bit.',true); $('go').disabled=false; return; }

  const res=aggregate(colors, today, usedFallback, samples);
  localStorage.setItem('cotd_'+today, JSON.stringify(res));
  render(res);
  setStatus(`Done — analyzed ${colors.length} photos.`);
  $('go').disabled=false;
}

function aggregate(hexes, date, fallback, samples){
  // bucket each dominant color, find the most common family, average it
  const buckets={};
  for(const hx of hexes){ const [r,g,b]=h2r(hx); const key=[q(r),q(g),q(b)].join(',');
    (buckets[key]=buckets[key]||[]).push([r,g,b]); }
  let best=null,bestN=0;
  for(const k in buckets){ if(buckets[k].length>bestN){bestN=buckets[k].length;best=k;} }
  const avg=arr=>arr.reduce((a,c)=>[a[0]+c[0],a[1]+c[1],a[2]+c[2]],[0,0,0]).map(v=>Math.round(v/arr.length));
  const [mr,mg,mb]=avg(buckets[best]);
  const winner=r2h(mr,mg,mb);
  const pct=Math.round(100*bestN/hexes.length);
  // overall average
  const [ar,ag,ab]=avg(hexes.map(h2r));
  // palette = top 6 buckets by count
  const top=Object.entries(buckets).sort((a,b)=>b[1].length-a[1].length).slice(0,6)
    .map(([k,arr])=>{const [r,g,b]=avg(arr);return r2h(r,g,b);});
  return {date, winner, pct, count:hexes.length, avg:r2h(ar,ag,ab), palette:top, samples, fallback};
}

function render(res){
  $('result').classList.add('show');
  const sw=$('swatch'); sw.style.background=res.winner;
  const dark=luma(res.winner)<140; sw.style.color=dark?'#fff':'#101018';
  $('rdate').textContent=(res.fallback?'Most recent uploads · ':'')+new Date(res.date).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('rhex').textContent=res.winner;
  $('rmeta').textContent=`${res.pct}% of ${res.count} photos landed in this color family · overall average ${res.avg}`;
  $('palette').innerHTML=res.palette.map(c=>`<span style="background:${c}" title="${c}"></span>`).join('');
  $('grid').innerHTML=res.samples.map(s=>`<a class="thumb" href="${s.link}" target="_blank" rel="noopener" title="${s.c} — ${s.who}">${s.thumb?`<img src="${s.thumb}" alt="">`:''}<i style="background:${s.c}"></i></a>`).join('');
  $('foot').innerHTML='Photos & colors via the <a href="https://unsplash.com/developers" target="_blank" rel="noopener">Unsplash API</a>. Sampled from the latest uploads (not the entire day’s catalog).';
}

function setStatus(t,err){ const s=$('status'); s.textContent=t; s.className='status'+(err?' err':''); }
function h2r(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function r2h(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');}
function q(v){return Math.round(v/48)*48;} // ~6 levels per channel
function luma(hex){const [r,g,b]=h2r(hex);return 0.299*r+0.587*g+0.114*b;}
run(); // auto-reveal today's color on load
</script>
</body>
</html>
